<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ukemi Listening Test</title>
<style>
/* Layout: one centred column of steps; each trial is a large play area above response buttons. Single dark look, matching the questionnaire and trainer. */
:root{
  --bg:#0c121b; --panel:#141d2a; --line:#273447; --fg:#e9edf2; --muted:#93a1b3;
  --tatami:#c9b37e; --ok:#8fcf9a; --bad:#e6845c; --warn:#e6a35c;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-size:1.05rem}
.brand .jp{color:var(--tatami);font-size:1.3rem;font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);padding:6px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--tatami);color:#1a160c;font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--line);margin-bottom:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tatami);width:0;transition:width .3s}
h1{font-size:1.55rem;line-height:1.25;margin:0 0 10px;text-wrap:balance}
h2{font-size:1.2rem;margin:0 0 6px;text-wrap:balance}
p{margin:0 0 12px;max-width:62ch}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tatami);margin-bottom:6px}
section.step{display:grid;gap:18px}
.field{display:grid;gap:6px}
.field label{font-weight:600}
select,input[type=number],textarea{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;width:100%}
textarea{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.gdpr{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.gdpr summary{cursor:pointer;font-weight:600;color:var(--tatami)}
.gdpr dl{margin:12px 0 0;display:grid;gap:10px}
.gdpr dt{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gdpr dd{margin:2px 0 0;overflow-wrap:anywhere}
.consent{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.consent input{width:22px;height:22px;margin-top:2px;accent-color:var(--tatami);flex:none}
.btns{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{background:var(--tatami);color:#1a160c;border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;min-height:48px}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--tatami);outline-offset:2px}
.err{color:var(--warn);font-size:.92rem;min-height:1.4em}
.player{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 16px;display:grid;justify-items:center;gap:10px;text-align:center}
.playbtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--tatami);color:#1a160c;font-size:2rem;cursor:pointer}
.playbtn:disabled{opacity:.35}
.playbtn.on{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){.playbtn.on{animation:none}}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resp .btn{min-height:58px}
.resp3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.resp3 .btn{min-height:56px;padding:10px 8px;font-size:.95rem}
.fb{border-radius:10px;padding:12px 14px;font-weight:600;text-align:center}
.fb.ok{background:rgba(143,207,154,.14);color:var(--ok)}
.fb.no{background:rgba(230,132,92,.14);color:var(--bad)}
.examples{display:grid;gap:10px}
.ex{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ex .btn{min-height:40px;padding:8px 16px}
.items{display:grid;gap:14px}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.scale button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;min-height:44px;font:inherit;font-family:var(--mono);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--tatami);border-color:var(--tatami);color:#1a160c;font-weight:700}
.anchors{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--muted)}
.rank{display:grid;gap:10px}
.rankrow{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.rankrow .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pos{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.pos button{height:42px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-family:var(--mono);cursor:pointer}
.pos button[aria-pressed="true"]{background:var(--tatami);color:#1a160c;border-color:var(--tatami);font-weight:700}
.mini{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.counter{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.stagecap{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.done{text-align:center;padding-block:40px;display:grid;gap:10px;justify-items:center}
.pid{font-family:var(--mono);font-size:1.3rem;color:var(--tatami);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 16px;user-select:all}

</head>

let ctx,master,room;
function initAudio(){
 try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
 if(ctx){ if(ctx.state==="suspended") ctx.resume(); return; }
 ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});
 master=ctx.createGain(); master.gain.value=.8;
 const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=3; comp.attack.value=.003; comp.release.value=.25;
 room=ctx.createConvolver(); const n=ctx.sampleRate*1.1,b=ctx.createBuffer(2,n,ctx.sampleRate);
 for(let c=0;c<2;c++){const d=b.getChannelData(c); for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);} room.buffer=b;
 const rg=ctx.createGain(); rg.gain.value=.14; master.connect(comp); comp.connect(ctx.destination); room.connect(rg); rg.connect(comp);
}
let AT=0; const now=()=>AT;
function voice({type="sine",f0,f1,dur=.5,attack=.004,peak=.5,dest,glide=dur*.6,pan=0}){

 const pb=s.querySelector(".playbtn"), opts=[...s.querySelectorAll("[data-i]")];
 pb.onclick=()=>{ initAudio(); const t=ctx.currentTime+.1; [0,1,2].forEach(i=>tone(i===quiet?0.28:1,t+i*.8)); S.hp.played++; pb.classList.add("on"); setTimeout(()=>{pb.classList.remove("on"); opts.forEach(o=>o.disabled=false);},2500); };
 opts.forEach(o=>o.onclick=()=>{ S.hp.answers.push(+o.dataset.i===quiet?1:0);
  if(S.hp.answers.length<2) vHpAgain(); else { S.step="block"; S.block=0; S.phase="fam"; S.fam={}; render(); } });
 app.appendChild(s);
}
function vHpAgain(){ app.innerHTML=""; vHp(); }

function cond(){ return S.order[S.block]; }
function blockHead(){
 return `<div><div class="eyebrow">${tt("blockEyebrow")} ${tt("names")[cond()]} · ${S.block+1} ${tt("of")} ${S.order.length}</div>`;
}
function vBlock(){
 const c=cond();
 if(S.phase==="fam") return vFam(c);
 if(S.phase==="train"||S.phase==="test") return vTrial(c);
 if(S.phase==="rate") return vRate(c);
}
function vFam(c){
 const s=h(`<section class="step">${blockHead()}<h2>${tt("famTitle")}</h2><p class="muted">${tt("famText")}</p></div><div class="examples"></div></section>`);
 const box=s.querySelector(".examples"), stage=stageEl(); box.before(stage);
 const cv=stage.querySelector("canvas"), cap=stage.querySelector(".cap");
 TYPES.forEach(ty=>{
  const r=h(`<div class="ex"><div><b>${tt("types")[ty]}</b><div class="muted" style="font-size:.88rem">${tt("typesHelp")[ty]}</div></div><button class="btn ghost" type="button">▶ ${tt("play")}</button></div>`);
  r.querySelector("button").onclick=()=>{ const inf=playFall(c,ty); cap.textContent=tt("types")[ty]; animate(cv,inf); S.fam[ty]=(S.fam[ty]||0)+1; };
  box.appendChild(r);
 });
 s.appendChild(nav(null,tt("next"),()=>{ if(TYPES.some(t=>!S.fam[t])) return tt("listenAll"); S.phase="train"; S.trial=0; render(); }));
 app.appendChild(s);
}
function vTrial(c){
 const phase=S.phase, list=S.plan[c][phase], k=S.trial, type=list[k], attn=type==="attn";
 const realType=attn?"correct":type;
 const s=h(`<section class="step">${blockHead()}<h2>${phase==="train"?tt("trainTitle"):tt("testTitle")}</h2>
   <p class="muted">${phase==="train"?tt("trainText"):tt("testText")}</p></div>
   ${attn?`<div class="fb ok" style="text-align:left">${tt("attention")}</div>`:""}
   <div class="player"><button class="playbtn" type="button" aria-label="${tt("play")}">▶</button>
     <span class="counter">${k+1} / ${list.length}</span>
     <button class="mini" type="button" id="replay" hidden>${tt("replay")}</button></div>
   <div class="field"><span style="font-weight:600">${tt("q1")}</span>
     <button class="btn ghost" type="button" id="rC" disabled style="min-height:58px">✓ ${tt("correctBtn")}</button>
     <span class="muted" style="font-size:.88rem;margin-top:4px">${tt("q2")}</span>
     <div class="resp3" id="q2">${ERRORS.map(e=>`<button class="btn ghost" type="button" data-e="${e}" disabled>${tt("types")[e]}</button>`).join("")}</div></div>
   <div id="fb"></div></section>`);
 const pb=s.querySelector(".playbtn"), rp=s.querySelector("#replay"), rC=s.querySelector("#rC"), q2=s.querySelector("#q2"), errB=[...s.querySelectorAll("[data-e]")], fb=s.querySelector("#fb");
 let info=null, tEnd=0, replays=0, resp=null, done=false;
 const play=()=>{ info=playFall(c,realType); pb.disabled=true; pb.classList.add("on");
   setTimeout(()=>{ pb.classList.remove("on"); tEnd=performance.now(); rC.disabled=false; errB.forEach(b=>b.disabled=false); if(replays===0) rp.hidden=false; },info.ms); };
 pb.onclick=()=>{ if(info) return; play(); };
 rp.onclick=()=>{ replays++; rp.disabled=true; rp.textContent=tt("replayed"); rC.disabled=true; errB.forEach(b=>b.disabled=true); play(); };
 const finish=(errChoice)=>{
  if(done) return; done=true;
  const rt=Math.round(performance.now()-tEnd);
  const rec={cond:c,phase,trial:k+1,type:attn?"attn":type,resp,errResp:errChoice||"",rt,replays,events:JSON.stringify(info.events),blockPos:S.block+1};
  rec.correct = attn ? (resp==="correct") : (realType==="correct" ? resp==="correct" : resp==="faulty");
  rec.errCorrect = (realType!=="correct" && resp==="faulty") ? (errChoice===type) : null;
  S.trials.push(rec);
  [...s.querySelectorAll("button")].forEach(b=>b.disabled=true);
  rp.hidden=true;
  const advance=()=>{ S.trial++; if(S.trial>=list.length){ if(phase==="train"){S.phase="test"; S.trial=0;} else {S.phase="rate";} } render(); };
  if(phase==="train"){
   const ok=rec.correct&&(rec.errCorrect!==false);
   fb.appendChild(h(`<div style="display:grid;gap:12px"><div class="fb ${ok?"ok":"no"}">${ok?tt("right"):tt("wrong")} · ${tt("itWas")} ${tt("types")[type]}</div></div>`));
   const wrap=fb.firstChild, stage=stageEl(); wrap.appendChild(stage);
   const cv=stage.querySelector("canvas"); stage.querySelector(".cap").textContent=tt("nowPlaying");
   const show=()=>animate(cv,playFall(c,realType,{},info.ev));
   const bt=h(`<div class="btns"><button class="btn ghost" type="button">↻ ${tt("watchAgain")}</button><button class="btn" type="button">${tt("next")}</button></div>`);
   bt.children[0].onclick=show; bt.children[1].onclick=advance; wrap.appendChild(bt);
   setTimeout(show,300); setTimeout(()=>wrap.scrollIntoView({behavior:"smooth",block:"start"}),50);
  } else setTimeout(advance,350);
 };
 rC.onclick=()=>{ resp="correct"; finish(""); };
 errB.forEach(b=>b.onclick=()=>{ resp="faulty"; finish(b.dataset.e); });
 app.appendChild(s);
}
function scaleItem(label,val,on){
 const it=h(`<div class="item" style="display:grid;gap:8px"><div style="font-weight:600">${label}</div><div class="scale"></div><div class="anchors"><span>${tt("lo")}</span><span>${tt("hi")}</span></div></div>`);
 const sc=it.querySelector(".scale");
 for(let v=1;v<=7;v++){ const b=h(`<button type="button" aria-pressed="${val===v}">${v}</button>`);
  b.onclick=()=>{ on(v); sc.querySelectorAll("button").forEach((x,i)=>x.setAttribute("aria-pressed",String(i+1===v))); }; sc.appendChild(b); }
 return it;
}
function vRate(c){
 const R=S.ratings[c];
 const s=h(`<section class="step">${blockHead()}<h2>${tt("rateTitle")}</h2></div>
  <div class="examples"><div class="ex"><span>${tt("types").correct}</span><button class="btn ghost" type="button">▶ ${tt("hear")}</button></div></div><div class="items"></div></section>`);
 s.querySelector(".ex button").onclick=()=>playFall(c,"correct");
 const box=s.querySelector(".items"); tt("rate").forEach((q,i)=>box.appendChild(scaleItem(q,R[i],v=>R[i]=v)));
 s.appendChild(nav(null,tt("next"),()=>{ if(R.some(v=>!v)) return tt("needRate");
  S.block++; S.phase="fam"; S.fam={}; S.trial=0;
  if(S.block>=S.order.length){ S.step=(FORCE_BLOCK&&CONDITIONS.includes("m5"))?"force":"rank"; }
  render(); }));
 app.appendChild(s);
}
function vForce(){
 const F=S.force;
 if(!F.list) F.list=shuffle(["soft","soft","soft","soft","heavy","heavy","heavy","heavy"]);
 const I={soft:.25,heavy:.95};
 if(!F.ready){
  const s=h(`<section class="step"><div><h2>${tt("forceTitle")}</h2><p class="muted">${tt("forceText")}</p></div><div class="examples"></div></section>`);
  const box=s.querySelector(".examples");
  ["soft","heavy"].forEach(k=>{ const r=h(`<div class="ex"><b>${tt(k)}</b><button class="btn ghost" type="button">▶ ${tt("play")}</button></div>`);
   r.querySelector("button").onclick=()=>{ playFall("m5","correct",{intensity:I[k]}); F.heard[k]=1; }; box.appendChild(r); });
  s.appendChild(nav(null,tt("next"),()=>{ if(!F.heard.soft||!F.heard.heavy) return tt("listenAll"); F.ready=true; F.i=0; render(); }));
  return app.appendChild(s);
 }
 const k=F.list[F.i];
 const s=h(`<section class="step"><h2>${tt("forceTitle")}</h2>
  <div class="player"><button class="playbtn" type="button">▶</button><span class="counter">${F.i+1} / ${F.list.length}</span></div>
  <div class="field"><span style="font-weight:600">${tt("forceQ")}</span><div class="resp"><button class="btn ghost" type="button" data-k="soft" disabled>${tt("soft")}</button><button class="btn ghost" type="button" data-k="heavy" disabled>${tt("heavy")}</button></div></div></section>`);
 const pb=s.querySelector(".playbtn"); let tEnd=0, played=false;
 pb.onclick=()=>{ if(played) return; played=true; const inf=playFall("m5","correct",{intensity:I[k]}); pb.disabled=true; pb.classList.add("on");
  setTimeout(()=>{ pb.classList.remove("on"); tEnd=performance.now(); s.querySelectorAll("[data-k]").forEach(b=>b.disabled=false); },inf.ms); };
 s.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ F.trials.push({level:k,resp:b.dataset.k,correct:b.dataset.k===k,rt:Math.round(performance.now()-tEnd)});
  F.i++; if(F.i>=F.list.length) S.step="rank"; render(); });
 app.appendChild(s);
}
function vRank(){
 const n=CONDITIONS.length;
 const s=h(`<section class="step"><div><h2>${tt("rankTitle")}</h2><p class="muted">${tt("rankHelp")}</p></div><div class="rank"></div>
  <div class="field"><label for="comments">${tt("comments")}</label><textarea id="comments" placeholder="${tt("commentsPh")}"></textarea></div></section>`);
 const box=s.querySelector(".rank");
 const draw=()=>{ box.innerHTML="";
  S.order.forEach(c=>{
   const row=h(`<div class="rankrow"><div class="top"><b>${tt("blockEyebrow")} ${tt("names")[c]}</b><button class="mini" type="button">▶ ${tt("hear")}</button></div><div class="pos" style="--n:${n}"></div></div>`);
   row.querySelector(".mini").onclick=()=>playFall(c,"correct");
   const pos=row.querySelector(".pos");
   for(let r=1;r<=n;r++){ const b=h(`<button type="button" aria-pressed="${S.rank[c]===r}">${r}</button>`);
    b.onclick=()=>{ const other=CONDITIONS.find(x=>x!==c&&S.rank[x]===r); if(other){ if(S.rank[c]) S.rank[other]=S.rank[c]; else delete S.rank[other]; } S.rank[c]=r; draw(); };
    pos.appendChild(b); }
   box.appendChild(row);
  }); };
 draw();
 const ta=s.querySelector("#comments"); ta.value=S.comments; ta.oninput=()=>S.comments=ta.value;
 s.appendChild(nav(null,tt("submit"),()=>{
  const rs=CONDITIONS.map(c=>S.rank[c]); if(rs.some(x=>!x)||new Set(rs).size!==n) return tt("needRank");
  if(S.sending) return;
  if(!S.rec) S.rec=record();
  S.sending=true; const btn=s.querySelector(".btns .btn:last-child"); btn.disabled=true; btn.textContent=tt("sending");
  send(S.rec).then(ok=>{ S.sending=false; btn.disabled=false; btn.textContent=tt("submit");
   if(ok) go("done"); else s.querySelector(".err").textContent=tt("sendFail"); });
 }));
 app.appendChild(s);
}
function vDone(){
 app.appendChild(h(`<section class="step done"><div style="font-size:2.4rem;color:var(--ok)">✓</div><h1>${tt("doneTitle")}</h1><p>${tt("done1")}</p><p class="muted">${tt("pidNote")}</p><div class="pid">${S.rec?S.rec.pid:""}</div></section>`));
}

/* ================= RECORD + SEND ================= */
function record(){
 const P=S.profile;
 const rec={pid:"S2"+Date.now().toString(36).toUpperCase(),timestamp:new Date().toISOString(),version:VERSION,lang,
  belt:BELT[+P.belt],years:+P.years,bjj_belt:BJJ[+P.bjj],bjj_years:+P.bjjYears,music:MUS[+P.music],age:AGE[+P.age],hearing:HEAR[+P.hearing],prior_study1:PRIOR[+P.prior],
  conditions:CONDITIONS.join(">"),order:S.order.join(">"),order_source:S.orderSource,
  duration_s:Math.round((Date.now()-S.started)/1000),hp_correct:S.hp.answers.reduce((a,b)=>a+b,0),
  attn_block:S.attnBlock, attn_pass:(S.trials.find(t=>t.type==="attn")||{}).correct===true,
  comments:S.comments.trim()};
 CONDITIONS.forEach(c=>{
  const tr=S.trials.filter(t=>t.cond===c&&t.phase==="train"), te=S.trials.filter(t=>t.cond===c&&t.phase==="test"&&t.type!=="attn");
  const d=sdt(te), ef=te.filter(t=>t.errCorrect!==null);
  Object.assign(rec,{
   [c+"_pos"]:S.order.indexOf(c)+1,
   [c+"_train_acc"]:+(tr.filter(t=>t.correct).length/tr.length).toFixed(3),
   [c+"_train_first4"]:tr.slice(0,4).filter(t=>t.correct).length,[c+"_train_last4"]:tr.slice(4).filter(t=>t.correct).length,
   [c+"_test_acc"]:+(te.filter(t=>t.correct).length/te.length).toFixed(3),
   [c+"_hits"]:d.hits,[c+"_fas"]:d.fas,[c+"_dprime"]:+d.dprime.toFixed(3),[c+"_crit"]:+d.crit.toFixed(3),
   [c+"_errid_acc"]:ef.length?+(ef.filter(t=>t.errCorrect).length/ef.length).toFixed(3):"",
   [c+"_rt_median"]:median(te.map(t=>t.rt)),[c+"_replays"]:te.reduce((a,t)=>a+t.replays,0),
   [c+"_pleasant"]:S.ratings[c][0],[c+"_use"]:S.ratings[c][1],[c+"_rank"]:S.rank[c]
  });
 });
 if(S.force.trials.length){ rec.force_acc=+(S.force.trials.filter(t=>t.correct).length/S.force.trials.length).toFixed(3); }
 rec.trials_json=JSON.stringify(S.trials.map(t=>[t.cond,t.phase,t.trial,t.type,t.resp,t.errResp,t.rt,t.replays,t.blockPos]));
 rec.force_json=JSON.stringify(S.force.trials.map(t=>[t.level,t.resp,t.rt]));
 return rec;
}
function median(a){ if(!a.length) return ""; const s=a.slice().sort((x,y)=>x-y), m=Math.floor(s.length/2); return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2); }
async function send(rec){
 try{ localStorage.setItem("ukemiS2.last",JSON.stringify(rec)); }catch(e){}
 if(!/^https:/.test(SUBMIT_URL)) return true;
 const body=JSON.stringify(rec);
 try{ const r=await fetch(SUBMIT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
  if(r.ok){ try{ const j=await r.json(); return j.ok!==false; }catch(e){ return true; } } return false;
 }catch(e){ try{ await fetch(SUBMIT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body}); return true; }catch(e2){ return false; } }
}

/* ================= BOOT ================= */
function setLang(l){ lang=l; document.getElementById("lang-en").setAttribute("aria-pressed",String(l==="en")); document.getElementById("lang-ja").setAttribute("aria-pressed",String(l==="ja")); render(); }
document.getElementById("lang-en").onclick=()=>setLang("en");
document.getElementById("lang-ja").onclick=()=>setLang("ja");
window.__S2={get S(){return S;},ORDERS,williams,sdt,record};
fresh(); render();
})();
</script>
